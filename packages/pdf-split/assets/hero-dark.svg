<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
<title id="title">@utilitly/pdf-split</title>
<desc id="desc">A six-page PDF fans out into three files: pages 1-2, page 3, and pages 4 to the end.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e8e8f3; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.muted { fill: #9a9bb6; }
.faint { fill: #5d5e7a; }
.accent { fill: #9a9bfb; }
.anim { transform-box: fill-box; transform-origin: center; }
.g1 { animation: g1 6s ease-in-out infinite; }
.g2 { animation: g2 6s ease-in-out infinite; }
.g3 { animation: g3 6s ease-in-out infinite; }
.lbl { animation: lbl 6s ease-in-out infinite; }
@keyframes g1 { 0%, 20% { transform: translate(245px, 0); } 46%, 90% { transform: translate(0, 0); } 100% { transform: translate(245px, 0); } }
@keyframes g2 { 0%, 20% { transform: translate(10px, -10px); } 46%, 90% { transform: translate(0, 0); } 100% { transform: translate(10px, -10px); } }
@keyframes g3 { 0%, 20% { transform: translate(-230px, -15px); } 46%, 90% { transform: translate(0, 0); } 100% { transform: translate(-230px, -15px); } }
@keyframes lbl { 0%, 46% { opacity: 0; } 54%, 86% { opacity: 1; } 90%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="839" height="259" rx="16" fill="#11121b" stroke="#2c2d40"/>
<g class="anim g3"><rect x="630" y="50" width="90" height="116" rx="5" fill="#1d1e2c" stroke="#2c2d40"/><rect x="640" y="60" width="38" height="7" rx="2" fill="#9a9bfb"/><text x="710" y="67" text-anchor="end" font-size="10" class="mono muted">6</text><rect x="640" y="78" width="57" height="4" rx="2" fill="#33344a"/><rect x="640" y="89" width="48" height="4" rx="2" fill="#33344a"/><rect x="640" y="100" width="63" height="4" rx="2" fill="#33344a"/><rect x="640" y="111" width="41" height="4" rx="2" fill="#33344a"/><rect x="640" y="122" width="53" height="4" rx="2" fill="#33344a"/><rect x="625" y="55" width="90" height="116" rx="5" fill="#1d1e2c" stroke="#2c2d40"/><rect x="635" y="65" width="38" height="7" rx="2" fill="#9a9bfb"/><text x="705" y="72" text-anchor="end" font-size="10" class="mono muted">5</text><rect x="635" y="83" width="57" height="4" rx="2" fill="#33344a"/><rect x="635" y="94" width="48" height="4" rx="2" fill="#33344a"/><rect x="635" y="105" width="63" height="4" rx="2" fill="#33344a"/><rect x="635" y="116" width="41" height="4" rx="2" fill="#33344a"/><rect x="635" y="127" width="53" height="4" rx="2" fill="#33344a"/><rect x="620" y="60" width="90" height="116" rx="5" fill="#1d1e2c" stroke="#2c2d40"/><rect x="630" y="70" width="38" height="7" rx="2" fill="#9a9bfb"/><text x="700" y="77" text-anchor="end" font-size="10" class="mono muted">4</text><rect x="630" y="88" width="57" height="4" rx="2" fill="#33344a"/><rect x="630" y="99" width="48" height="4" rx="2" fill="#33344a"/><rect x="630" y="110" width="63" height="4" rx="2" fill="#33344a"/><rect x="630" y="121" width="41" height="4" rx="2" fill="#33344a"/><rect x="630" y="132" width="53" height="4" rx="2" fill="#33344a"/></g>
<g class="lbl"><rect x="640" y="20" width="60" height="22" rx="11" fill="#26274a"/><text x="670" y="35.5" text-anchor="middle" font-size="12.5" class="mono accent">4-end</text>
<text x="670" y="200" text-anchor="middle" font-size="13" class="mono muted">part3.pdf</text></g>
<g class="anim g2"><rect x="375" y="60" width="90" height="116" rx="5" fill="#1d1e2c" stroke="#2c2d40"/><rect x="385" y="70" width="38" height="7" rx="2" fill="#9a9bfb"/><text x="455" y="77" text-anchor="end" font-size="10" class="mono muted">3</text><rect x="385" y="88" width="57" height="4" rx="2" fill="#33344a"/><rect x="385" y="99" width="48" height="4" rx="2" fill="#33344a"/><rect x="385" y="110" width="63" height="4" rx="2" fill="#33344a"/><rect x="385" y="121" width="41" height="4" rx="2" fill="#33344a"/><rect x="385" y="132" width="53" height="4" rx="2" fill="#33344a"/></g>
<g class="lbl"><rect x="390" y="20" width="60" height="22" rx="11" fill="#26274a"/><text x="420" y="35.5" text-anchor="middle" font-size="12.5" class="mono accent">3</text>
<text x="420" y="200" text-anchor="middle" font-size="13" class="mono muted">part2.pdf</text></g>
<g class="anim g1"><rect x="135" y="55" width="90" height="116" rx="5" fill="#1d1e2c" stroke="#2c2d40"/><rect x="145" y="65" width="38" height="7" rx="2" fill="#9a9bfb"/><text x="215" y="72" text-anchor="end" font-size="10" class="mono muted">2</text><rect x="145" y="83" width="57" height="4" rx="2" fill="#33344a"/><rect x="145" y="94" width="48" height="4" rx="2" fill="#33344a"/><rect x="145" y="105" width="63" height="4" rx="2" fill="#33344a"/><rect x="145" y="116" width="41" height="4" rx="2" fill="#33344a"/><rect x="145" y="127" width="53" height="4" rx="2" fill="#33344a"/><rect x="130" y="60" width="90" height="116" rx="5" fill="#1d1e2c" stroke="#2c2d40"/><rect x="140" y="70" width="38" height="7" rx="2" fill="#9a9bfb"/><text x="210" y="77" text-anchor="end" font-size="10" class="mono muted">1</text><rect x="140" y="88" width="57" height="4" rx="2" fill="#33344a"/><rect x="140" y="99" width="48" height="4" rx="2" fill="#33344a"/><rect x="140" y="110" width="63" height="4" rx="2" fill="#33344a"/><rect x="140" y="121" width="41" height="4" rx="2" fill="#33344a"/><rect x="140" y="132" width="53" height="4" rx="2" fill="#33344a"/></g>
<g class="lbl"><rect x="147.5" y="20" width="60" height="22" rx="11" fill="#26274a"/><text x="177.5" y="35.5" text-anchor="middle" font-size="12.5" class="mono accent">1-2</text>
<text x="177.5" y="200" text-anchor="middle" font-size="13" class="mono muted">part1.pdf</text></g>
<text x="36" y="238" font-size="14" class="mono">await splitPdf(pdf, '1-2, 3, 4-end')</text><text x="804" y="238" font-size="12.5" text-anchor="end" class="muted">one file per part</text>
</svg>
