<g class="anim keep k3"><rect x="375" y="44" width="90" height="116" rx="5" fill="#1d1e2c" stroke="#2c2d40"/><rect x="385" y="54" width="38" height="7" rx="2" fill="#9a9bfb"/><text x="455" y="61" text-anchor="end" font-size="10" class="mono muted">3</text><rect x="385" y="72" width="57" height="4" rx="2" fill="#33344a"/><rect x="385" y="83" width="48" height="4" rx="2" fill="#33344a"/><rect x="385" y="94" width="63" height="4" rx="2" fill="#33344a"/><rect x="385" y="105" width="41" height="4" rx="2" fill="#33344a"/><rect x="385" y="116" width="53" height="4" rx="2" fill="#33344a"/></g>
