<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
<title id="title">@utilitly/pdf-delete-pages</title>
<desc id="desc">Pages 2 and 4 of a five-page PDF are marked and lift away, and the remaining pages 1, 3 and 5 close the gap.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e8e8f3; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.muted { fill: #9a9bb6; }
.faint { fill: #5d5e7a; }
.accent { fill: #9a9bfb; }
.anim { transform-box: fill-box; transform-origin: center; }
.gone { opacity: 0; animation: gone 6s ease-in-out infinite; }
@keyframes gone { 0% { opacity: 0; transform: translateY(0); } 6%, 26% { opacity: 1; transform: translateY(0); } 40%, 100% { opacity: 0; transform: translateY(-34px); } }
.xmark { animation: xmark 6s ease-out infinite; }
@keyframes xmark { 0%, 10% { opacity: 0; } 16%, 100% { opacity: 1; } }
.k1 { transform: translateX(120px); animation: k1 6s ease-in-out infinite; }
@keyframes k1 { 0%, 40% { transform: translateX(0); } 56%, 92% { transform: translateX(120px); } 100% { transform: translateX(0); } }
.k3 { transform: translateX(0px); animation: k3 6s ease-in-out infinite; }
@keyframes k3 { 0%, 40% { transform: translateX(0); } 56%, 92% { transform: translateX(0px); } 100% { transform: translateX(0); } }
.k5 { transform: translateX(-120px); animation: k5 6s ease-in-out infinite; }
@keyframes k5 { 0%, 40% { transform: translateX(0); } 56%, 92% { transform: translateX(-120px); } 100% { transform: translateX(0); } }
.result { animation: result 6s ease-in-out infinite; }
@keyframes result { 0%, 56% { opacity: 0; } 62%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
