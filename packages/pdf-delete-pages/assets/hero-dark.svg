<text x="420" y="196" text-anchor="middle" font-size="13" class="mono result">cleaned.pdf · 3 pages</text>
<text x="36" y="238" font-size="14" class="mono">await deletePages(pdf, '2, 4')</text><text x="804" y="238" font-size="12.5" text-anchor="end" class="muted">the rest stay, in their order</text>
