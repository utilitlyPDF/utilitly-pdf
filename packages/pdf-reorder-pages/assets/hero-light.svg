<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
<title id="title">@utilitly/pdf-reorder-pages</title>
<desc id="desc">Five colour-coded pages move into a new order: page 3 jumps to the front, then 1, 2, 5 and 4.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c1c30; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.muted { fill: #6b6b86; }
.faint { fill: #a6a7bf; }
.accent { fill: #4f46e5; }
.anim { transform-box: fill-box; transform-origin: center; }
.m1 { transform: translateX(120px); animation: m1 7s ease-in-out infinite; }
@keyframes m1 { 0%, 22% { transform: translateX(0); } 42%, 86% { transform: translateX(120px); } 98%, 100% { transform: translateX(0); } }
.m2 { transform: translateX(120px); animation: m2 7s ease-in-out infinite; }
@keyframes m2 { 0%, 22% { transform: translateX(0); } 42%, 86% { transform: translateX(120px); } 98%, 100% { transform: translateX(0); } }
.m3 { transform: translate(-240px, 0); animation: m3 7s ease-in-out infinite; }
@keyframes m3 { 0%, 18% { transform: translate(0, 0); } 30% { transform: translate(-120px, -36px); } 42%, 86% { transform: translate(-240px, 0); } 98%, 100% { transform: translate(0, 0); } }
.m4 { transform: translateX(120px); animation: m4 7s ease-in-out infinite; }
@keyframes m4 { 0%, 22% { transform: translateX(0); } 42%, 86% { transform: translateX(120px); } 98%, 100% { transform: translateX(0); } }
.m5 { transform: translate(-120px, 0); animation: m5 7s ease-in-out infinite; }
@keyframes m5 { 0%, 18% { transform: translate(0, 0); } 30% { transform: translate(-60px, -36px); } 42%, 86% { transform: translate(-120px, 0); } 98%, 100% { transform: translate(0, 0); } }
.order { animation: order 7s ease-in-out infinite; }
@keyframes order { 0%, 44% { opacity: 0; } 52%, 86% { opacity: 1; } 94%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="839" height="259" rx="16" fill="#f6f7fb" stroke="#dcdcea"/>
<g class="anim m1"><rect x="135" y="50" width="90" height="116" rx="5" fill="#ffffff" stroke="#dcdcea"/><rect x="145" y="60" width="38" height="7" rx="2" fill="#4f46e5"/><text x="215" y="67" text-anchor="end" font-size="10" class="mono muted">1</text><rect x="145" y="78" width="57" height="4" rx="2" fill="#e4e4ef"/><rect x="145" y="89" width="48" height="4" rx="2" fill="#e4e4ef"/><rect x="145" y="100" width="63" height="4" rx="2" fill="#e4e4ef"/><rect x="145" y="111" width="41" height="4" rx="2" fill="#e4e4ef"/><rect x="145" y="122" width="53" height="4" rx="2" fill="#e4e4ef"/></g>
<g class="anim m2"><rect x="255" y="50" width="90" height="116" rx="5" fill="#ffffff" stroke="#dcdcea"/><rect x="265" y="60" width="38" height="7" rx="2" fill="#1a9b4b"/><text x="335" y="67" text-anchor="end" font-size="10" class="mono muted">2</text><rect x="265" y="78" width="57" height="4" rx="2" fill="#e4e4ef"/><rect x="265" y="89" width="48" height="4" rx="2" fill="#e4e4ef"/><rect x="265" y="100" width="63" height="4" rx="2" fill="#e4e4ef"/><rect x="265" y="111" width="41" height="4" rx="2" fill="#e4e4ef"/><rect x="265" y="122" width="53" height="4" rx="2" fill="#e4e4ef"/></g>
<g class="anim m4"><rect x="495" y="50" width="90" height="116" rx="5" fill="#ffffff" stroke="#dcdcea"/><rect x="505" y="60" width="38" height="7" rx="2" fill="#e5484d"/><text x="575" y="67" text-anchor="end" font-size="10" class="mono muted">4</text><rect x="505" y="78" width="57" height="4" rx="2" fill="#e4e4ef"/><rect x="505" y="89" width="48" height="4" rx="2" fill="#e4e4ef"/><rect x="505" y="100" width="63" height="4" rx="2" fill="#e4e4ef"/><rect x="505" y="111" width="41" height="4" rx="2" fill="#e4e4ef"/><rect x="505" y="122" width="53" height="4" rx="2" fill="#e4e4ef"/></g>
<g class="anim m5"><rect x="615" y="50" width="90" height="116" rx="5" fill="#ffffff" stroke="#dcdcea"/><rect x="625" y="60" width="38" height="7" rx="2" fill="#6b6b86"/><text x="695" y="67" text-anchor="end" font-size="10" class="mono muted">5</text><rect x="625" y="78" width="57" height="4" rx="2" fill="#e4e4ef"/><rect x="625" y="89" width="48" height="4" rx="2" fill="#e4e4ef"/><rect x="625" y="100" width="63" height="4" rx="2" fill="#e4e4ef"/><rect x="625" y="111" width="41" height="4" rx="2" fill="#e4e4ef"/><rect x="625" y="122" width="53" height="4" rx="2" fill="#e4e4ef"/></g>
<g class="anim m3"><rect x="375" y="50" width="90" height="116" rx="5" fill="#ffffff" stroke="#dcdcea"/><rect x="385" y="60" width="38" height="7" rx="2" fill="#d97706"/><text x="455" y="67" text-anchor="end" font-size="10" class="mono muted">3</text><rect x="385" y="78" width="57" height="4" rx="2" fill="#e4e4ef"/><rect x="385" y="89" width="48" height="4" rx="2" fill="#e4e4ef"/><rect x="385" y="100" width="63" height="4" rx="2" fill="#e4e4ef"/><rect x="385" y="111" width="41" height="4" rx="2" fill="#e4e4ef"/><rect x="385" y="122" width="53" height="4" rx="2" fill="#e4e4ef"/></g>
<text x="420" y="200" text-anchor="middle" font-size="13" class="mono order">[3, 1, 2, 5, 4]</text>
<text x="36" y="238" font-size="14" class="mono">await reorderPages(pdf, [3, 1, 2, 5, 4])</text><text x="804" y="238" font-size="12.5" text-anchor="end" class="muted">every page, in the order you list</text>
</svg>
