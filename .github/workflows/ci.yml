name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Node line that is still supported upstream.
        node: [22, 24, 26]
    steps:
      # Actions are pinned to a commit so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Leak check, typecheck, build, tests, then publint + attw on every package.
      - run: npm run check
      # Installs every package from its tarball into a fresh project and runs it.
      - run: node scripts/smoke-install.mjs
